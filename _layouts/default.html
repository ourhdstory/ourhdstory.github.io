<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-slate-50">
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center justify-between">
        <div class="flex-1">
          <a href="/" class="text-3xl font-bold text-slate-900">Our HD Story</a>
        </div>
        <nav class="hidden md:flex space-x-8">
          <a href="/" class="text-slate-600 hover:text-slate-900 transition">Home</a>
          <a href="/about.html" class="text-slate-600 hover:text-slate-900 transition">About</a>
          <a href="/gallery.html" class="text-slate-600 hover:text-slate-900 transition">Gallery</a>
          <a href="/blog/" class="text-slate-600 hover:text-slate-900 transition">Blog</a>
          <a href="/contact.html" class="text-slate-600 hover:text-slate-900 transition">Contact</a>
        </nav>
        <!-- Mobile menu button -->
        <div class="md:hidden">
          <button class="text-slate-600 hover:text-slate-900">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    {{ content }}
  </main>

  <footer class="bg-slate-900 text-white mt-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 text-center">
      <p class="text-slate-400">© 2025 Our HD Story — Built with love.</p>
    </div>
  </footer>
</body>
</html>
