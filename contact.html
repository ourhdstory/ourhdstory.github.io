---
layout: default
title: Contact
---

<div class="max-w-2xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <h2 class="text-4xl font-bold text-slate-900 mb-6">Contact Us</h2>
  <p class="text-lg text-slate-600 leading-relaxed mb-8">Feel free to reach out via email: <a href="mailto:youremail@example.com" class="text-blue-600 hover:text-blue-700 font-medium">youremail@example.com</a></p>
  
  <form action="https://formspree.io/f/yourformid" method="POST" class="space-y-6">
    <div>
      <label for="name" class="block text-sm font-medium text-slate-900 mb-2">Name</label>
      <input type="text" name="name" id="name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
    </div>
    
    <div>
      <label for="email" class="block text-sm font-medium text-slate-900 mb-2">Email</label>
      <input type="email" name="_replyto" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
    </div>
    
    <div>
      <label for="message" class="block text-sm font-medium text-slate-900 mb-2">Message</label>
      <textarea name="message" id="message" rows="5" required class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
    </div>
    
    <button type="submit" class="w-full bg-slate-900 text-white font-medium py-2 px-4 rounded-lg hover:bg-slate-800 transition">Send Message</button>
  </form>
</div>
